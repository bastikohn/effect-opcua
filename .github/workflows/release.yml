name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run release checks
        run: pnpm check:release

  changesets:
    name: Version packages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          title: Version packages
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish packages
    if: github.ref == 'refs/heads/main' && needs.changesets.outputs.has-changesets == 'false'
    needs: [verify, changesets]
    runs-on: ubuntu-latest
    # Auth is npm OIDC trusted publishing: each package on npmjs.com trusts
    # this repo + this workflow file + the `npm-publish` environment, so the
    # job must run in that environment for the OIDC claim to match. No npm
    # token is involved (npm deprecated 2FA-bypassing tokens for publishing).
    # NOTE: a brand-new package cannot be first-published via OIDC; bootstrap
    # it manually once, then add the trusted publisher on npmjs.com.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # Node 24 ships npm >= 11.5.1, required for OIDC trusted publishing.
          # No registry-url: passing it makes setup-node write an .npmrc that
          # expects NODE_AUTH_TOKEN, which no longer exists; `npm publish`
          # exchanges the workflow's OIDC token for credentials on its own.
          node-version: "24.x"

      - name: Build
        run: pnpm build

      - name: Publish changed public packages
        run: pnpm changeset:publish

  back-merge:
    name: Back-merge main into dev
    # Runs only after a successful publish (needs: publish already implies the
    # `has-changesets == false` gate). Keeps `dev` in sync with the version and
    # CHANGELOG commits the changesets bot lands on `main` at release time, so
    # the next `dev -> main` PR diffs cleanly instead of drifting.
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          # Default GITHUB_TOKEN pushes do not re-trigger workflows, so this
          # cannot loop back into another Release run.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Fast-forwards when dev has not advanced; creates a merge commit
          # otherwise. A real conflict fails the job loudly for manual fixup.
          git merge --no-edit origin/main
          git push origin HEAD:dev
